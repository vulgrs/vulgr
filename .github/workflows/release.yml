name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-gyp needs Python for node-pty; Windows and macOS runners already ship
      # the C++ toolchain (Visual Studio Build Tools / Xcode Command Line Tools).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet: skip macOS keychain lookup.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Sign Windows installer with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-id: ${{ vars.SIGNPATH_PROJECT_ID || 'vulgr' }}
          signing-policy-id: ${{ vars.SIGNPATH_SIGNING_POLICY_ID || 'release-signing' }}
          artifact-configuration-id: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_ID || 'installer' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      - name: Replace installer with signed executable and refresh latest.yml checksum
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: |
          cp -f release-signed/*.exe release/
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const exe = fs.readdirSync("release").find(f => f.endsWith(".exe"));
            const buf = fs.readFileSync("release/" + exe);
            const sha512 = crypto.createHash("sha512").update(buf).digest("base64");
            const size = buf.length;
            let yml = fs.readFileSync("release/latest.yml", "utf8");
            yml = yml.replace(/sha512:\s*\S+/g, "sha512: " + sha512);
            yml = yml.replace(/size:\s*\d+/g, "size: " + size);
            fs.writeFileSync("release/latest.yml", yml);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only for .github/release-notes.md.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - run: ls -la release

      # Uploads the installers plus latest*.yml, which electron-updater reads.
      # Tags with a pre-release suffix (v0.2.0-beta) become pre-releases.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vulgr ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Our own notes first (the update card shows their bullet points), then GitHub's list.
          body_path: .github/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
