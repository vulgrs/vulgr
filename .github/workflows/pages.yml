name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - docs-site/**
      - docs/screenshot.png
      - ui/public/favicon.png
      - ui/public/logo.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site reuses the app's images instead of keeping its own copies.
      - name: Copy shared images
        run: |
          mkdir -p docs-site/assets
          cp docs/screenshot.png ui/public/favicon.png ui/public/logo.png docs-site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - id: deployment
        uses: actions/deploy-pages@v4
