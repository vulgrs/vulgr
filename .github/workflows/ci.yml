name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-gyp needs Python for node-pty.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb

      # Tests compare file contents after git operations; keep line endings as written.
      - name: Keep LF line endings in git
        run: git config --global core.autocrlf false

      - run: npm ci

      - run: npm run type-check

      - run: npm run build

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # Job logs are only visible to admins; a failing test's details also go
      # into an annotation, which anyone can read on the run page.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: node .github/scripts/annotate-test-failures.mjs test-output.txt

      # Starts the real app with a throwaway profile and fails on any load or
      # console error: the check that would have caught a blank window.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: npx electron dist/electron/main.js --smoke

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron dist/electron/main.js --smoke --no-sandbox
